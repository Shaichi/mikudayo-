<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Miku Live2D Renderer</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; }
  #app { width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="app"></div>
<!-- Cubism Core + PixiJS 6 + pixi-live2d-display (Cubism 4). Cubism 5 .moc3 chạy qua Core 5. -->
<script src="./lib/live2dcubismcore.min.js"></script>
<script src="./lib/pixi.min.js"></script>
<script src="./lib/cubism4.min.js"></script>
<script>
(function () {
  'use strict';

  // ---- Cầu nối với Flutter (cùng giao thức với avatar VRM) ----
  function toFlutter(obj) {
    var s = JSON.stringify(obj);
    try {
      if (window.MikuBridge && window.MikuBridge.postMessage) { window.MikuBridge.postMessage(s); return; }
      if (window.chrome && window.chrome.webview) { window.chrome.webview.postMessage(s); }
    } catch (e) { /* bỏ qua */ }
  }
  function fail(msg) { toFlutter({ type: 'error', message: String(msg) }); }
  window.addEventListener('error', function (e) { fail(e.message); });

  // ---- Biểu cảm: tham số đích (đã làm mượt) ----
  // Id lấy từ RetrynowMiku.cdi3.json / *.exp3.json. Giá trị 0..1 trừ khi ghi khác.
  var EMOTIONS = {
    neutral:     { ParamMouthForm: 0.0 },
    happy:       { ParamMouthForm: 1.0, Blush: 0.5 },
    excited:     { ParamMouthForm: 1.0, Blush: 0.7, Star: 1.0 },
    thinking:    { ParamMouthForm: -0.1, ParamBrowLY: 0.4, ParamBrowRY: 0.4, ParamAngleZ: 6, ParamEyeBallY: 0.5 },
    embarrassed: { ParamMouthForm: 0.5, Blush: 1.0, sideBlush: 1.0, han: 1.0 },
    sad:         { ParamMouthForm: -0.8, ParamBrowLY: -0.5, ParamBrowRY: -0.5, Tears: 0.6, Gloom1: 0.6 }
  };
  // Alias cho tên preset kiểu VRM.
  EMOTIONS.relaxed = EMOTIONS.thinking;

  var AXES = ['ParamMouthForm', 'ParamBrowLY', 'ParamBrowRY', 'ParamAngleZ', 'ParamEyeBallY',
              'Blush', 'sideBlush', 'han', 'Star', 'Tears', 'Gloom1'];
  var cur = {}, target = {};
  AXES.forEach(function (k) { cur[k] = 0; target[k] = 0; });

  var baseEmotion = 'neutral', tapTimer = null, bump = 0;
  function applyEmotion(name) {
    var e = EMOTIONS[name] || EMOTIONS.neutral;
    AXES.forEach(function (k) { target[k] = e[k] || 0; });
  }
  // Biểu cảm "nền" do app đặt; phản ứng khi chạm chỉ tạm thời rồi quay về nền.
  function setEmotion(name) {
    baseEmotion = name;
    if (tapTimer) { clearTimeout(tapTimer); tapTimer = null; }
    applyEmotion(name);
  }
  function tapReact(name, ms) {
    applyEmotion(name);
    bump = 1;
    if (tapTimer) clearTimeout(tapTimer);
    tapTimer = setTimeout(function () { tapTimer = null; applyEmotion(baseEmotion); }, ms);
  }

  // ---- Biểu cảm/đạo cụ/tư thế mở rộng: nạp thẳng từ file *.exp3.json của model ----
  // {type:'exp', name:'Tears', on:true|false}; {type:'exp_clear'} tắt hết. Tên = tên file bỏ ".exp3.json".
  var extras = {}, expDefs = {}; // extras[paramId] = {cur, target}; expDefs[name] = [{Id, Value}]
  function setExp(name, on) {
    function apply(def) {
      def.forEach(function (p) {
        var x = extras[p.Id] || (extras[p.Id] = { cur: 0, target: 0 });
        x.target = on ? p.Value : 0;
      });
    }
    if (expDefs[name]) { apply(expDefs[name]); return; }
    fetch('./model/' + encodeURIComponent(name) + '.exp3.json').then(function (r) { return r.json(); })
      .then(function (d) { expDefs[name] = d.Parameters || []; apply(expDefs[name]); })
      .catch(function (e) { fail('exp ' + name + ': ' + e.message); });
  }
  function clearExp() { Object.keys(extras).forEach(function (k) { extras[k].target = 0; }); }

  // ---- Lip-sync: Flutter gửi toàn bộ cues 1 lần, JS tự nội suy theo thời gian ----
  var speech = null; // { seq, cues, t0, dur }
  function startSpeech(m) {
    speech = { seq: m.seq, cues: m.cues || [], t0: performance.now(), dur: m.duration_ms || 0 };
  }
  function mouthNow() {
    if (!speech) return 0;
    var t = performance.now() - speech.t0;
    var c = speech.cues;
    if (!c.length || t > speech.dur + 120) { speech = null; return 0; }
    // cues sắp theo t_ms; nội suy tuyến tính giữa hai mốc kề nhau.
    var lo = 0, hi = c.length - 1;
    while (lo < hi) { var mid = (lo + hi + 1) >> 1; if (c[mid].t_ms <= t) lo = mid; else hi = mid - 1; }
    var a = c[lo], b = c[Math.min(lo + 1, c.length - 1)];
    if (b.t_ms === a.t_ms) return a.mouth;
    var f = Math.min(1, Math.max(0, (t - a.t_ms) / (b.t_ms - a.t_ms)));
    return a.mouth + (b.mouth - a.mouth) * f;
  }

  window.onFlutterMessage = function (raw) {
    try {
      var m = typeof raw === 'string' ? JSON.parse(raw) : raw;
      if (m.type === 'emotion') setEmotion(m.value);
      else if (m.type === 'speech') startSpeech(m);
      else if (m.type === 'exp') setExp(m.name, m.on !== false);
      else if (m.type === 'exp_clear') clearExp();
      else if (m.type === 'exps') { clearExp(); (m.names || []).forEach(function (n) { setExp(n, true); }); }
    } catch (e) { fail('bad message: ' + e.message); }
  };
  // Hook cho kiểm tra thủ công / headless.
  window.__miku = { setEmotion: setEmotion, startSpeech: startSpeech };

  // ---- Dựng sân khấu ----
  if (!window.Live2DCubismCore) { fail('Thiếu Live2D Cubism Core'); return; }
  var host = document.getElementById('app');
  var app = new PIXI.Application({
    resizeTo: host,
    transparent: true,
    antialias: true,
    autoDensity: true,
    resolution: Math.min(window.devicePixelRatio || 1, 2),
    powerPreference: 'high-performance'
  });
  host.appendChild(app.view);
  PIXI.live2d.Live2DModel.registerTicker(PIXI.Ticker);

  // Tham số Watermark = 1 là trạng thái ẩn (toggle S+Y của tác giả); #watermark=on để hiện lại.
  var WATERMARK_OFF = /watermark=on/.test(location.hash) ? 0 : 1;
  var modelRef = null;
  var mouthSmooth = 0, t = 0;

  // Nhìn theo con trỏ / ngón tay: look.x, look.y trong [-1, 1], làm mượt trong hook.
  var look = { x: 0, y: 0 }, lookCur = { x: 0, y: 0 };
  function setLook(ev) {
    var r = app.view.getBoundingClientRect();
    look.x = Math.max(-1, Math.min(1, ((ev.clientX - r.left) / r.width) * 2 - 1));
    look.y = Math.max(-1, Math.min(1, -(((ev.clientY - r.top) / r.height) * 2 - 1)));
  }
  window.addEventListener('pointermove', setLook);
  window.addEventListener('pointerdown', function (ev) {
    setLook(ev);
    if (!modelRef) return;
    // Vùng chạm theo tỷ lệ chiều cao model (0 = đỉnh đầu, 1 = chân).
    var b = modelRef.getLocalBounds(), r = app.view.getBoundingClientRect();
    var ny = (ev.clientY - r.top - modelRef.y) / (b.height * modelRef.scale.y);
    var area = ny < 0.17 ? 'head' : ny < 0.38 ? 'body' : 'lower';
    var react = area === 'head' ? 'embarrassed' : area === 'body' ? 'happy' : 'excited';
    tapReact(react, 2200);
    toFlutter({ type: 'tap', area: area });
  });
  document.addEventListener('pointerleave', function () { look.x = 0; look.y = 0; });
  window.addEventListener('blur', function () { look.x = 0; look.y = 0; });

  function layout() {
    if (!modelRef) return;
    var W = app.renderer.screen.width, H = app.renderer.screen.height;
    modelRef.scale.set(1);
    var b = modelRef.getLocalBounds();
    // Model là toàn thân; app cần nửa thân trên (đầu → eo), neo phía trên.
    // Phần dưới bị khung/composer che nên cho phép tràn ra ngoài canvas.
    var s = Math.min(W / (b.width * 0.55), H / (b.height * 0.62));
    modelRef.scale.set(s);
    modelRef.x = (W - b.width * s) / 2 - b.x * s;
    modelRef.y = H * 0.04 - b.y * s;
  }
  window.addEventListener('resize', layout);

  PIXI.live2d.Live2DModel.from('./model/RetrynowMiku.model3.json', { autoInteract: false })
    .then(function (model) {
      modelRef = model;
      window.__miku.model = model;
      app.stage.addChild(model);
      layout();

      var im = model.internalModel;
      im.on('beforeModelUpdate', function () {
        var core = im.coreModel, dt = Math.min(app.ticker.deltaMS / 1000, 0.1);
        t += dt;
        var k = 1 - Math.pow(0.001, dt); // làm mượt ~ vài trăm ms
        AXES.forEach(function (id) {
          cur[id] += (target[id] - cur[id]) * k;
          // AngleZ và EyeBallY cộng thêm dao động nhẹ bên dưới.
          if (id !== 'ParamAngleZ' && id !== 'ParamEyeBallY') core.setParameterValueById(id, cur[id]);
        });
        Object.keys(extras).forEach(function (id) {
          var x = extras[id];
          x.cur += (x.target - x.cur) * k;
          if (id !== 'Watermark') core.setParameterValueById(id, x.cur);
        });
        // Tắt watermark bằng chính tham số "Watermark" mà tác giả cung cấp
        // (hotkey S+Y trong VTube Studio).
        core.setParameterValueById('Watermark', WATERMARK_OFF);
        // Thở + lắc đầu nhẹ (idle).
        core.setParameterValueById('ParamBreath', 0.5 + 0.5 * Math.sin(t * 1.6));
        var lk = 1 - Math.pow(0.0005, dt);
        lookCur.x += (look.x - lookCur.x) * lk;
        lookCur.y += (look.y - lookCur.y) * lk;
        core.setParameterValueById('ParamAngleX', 4 * Math.sin(t * 0.55) + 18 * lookCur.x);
        bump = Math.max(0, bump - dt * 2.2);
        var bob = Math.sin((1 - bump) * Math.PI * 2) * bump; // một nhịp gật rồi tắt dần
        core.setParameterValueById('ParamAngleY', 2.5 * Math.sin(t * 0.8 + 1) + 14 * lookCur.y - 8 * bob);
        core.setParameterValueById('ParamAngleZ', cur.ParamAngleZ + 2 * Math.sin(t * 0.4 + 2) - 4 * lookCur.x);
        core.setParameterValueById('ParamBodyAngleY', 6 * bob);
        core.setParameterValueById('ParamBodyAngleX', 5 * lookCur.x);
        core.setParameterValueById('ParamEyeBallX', lookCur.x);
        core.setParameterValueById('ParamEyeBallY', Math.max(-1, Math.min(1, cur.ParamEyeBallY + lookCur.y)));
        // Miệng: lip-sync, làm mượt để không giật.
        var want = mouthNow();
        mouthSmooth += (want - mouthSmooth) * Math.min(1, dt * 25);
        core.setParameterValueById('ParamMouthOpenY', mouthSmooth);
      });

      var h = /emotion=(\w+)/.exec(location.hash);
      if (h) setEmotion(h[1]);
      var sp = /speak=1/.test(location.hash);
      if (sp) startSpeech({ seq: 1, duration_ms: 60000, cues: [{ t_ms: 0, mouth: 0.9 }, { t_ms: 60000, mouth: 0.9 }] });
      toFlutter({ type: 'loaded' });
    })
    .catch(function (e) { fail('load model: ' + (e && e.message ? e.message : e)); });
})();
</script>
</body>
</html>
