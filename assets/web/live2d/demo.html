<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Miku Live2D Demo</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #0b1220; color: #e6f1ff; display: flex; height: 100vh; }
  #stage { flex: 1; background: radial-gradient(circle at 50% 30%, #1d3557, #0b1220 70%); }
  iframe { width: 100%; height: 100%; border: 0; background: transparent; }
  #panel { width: 300px; padding: 12px; box-sizing: border-box; background: #111b2e; overflow: auto; }
  h3 { margin: 14px 0 6px; font-size: 13px; color: #8fb4ff; text-transform: uppercase; letter-spacing: .06em; }
  .row { display: flex; flex-wrap: wrap; gap: 4px; }
  button { padding: 7px 10px; border: 0; border-radius: 8px; background: #1f3358; color: #fff; font-size: 13px; cursor: pointer; }
  button:hover { background: #2c4a80; }
  button.on { background: #e0508f; }
  button.wide { width: 100%; }
  small { color: #7f93b5; line-height: 1.4; display: block; margin-top: 12px; }
  @media (max-width: 700px) { body { flex-direction: column; } #panel { width: auto; height: 45vh; } }
</style>
</head>
<body>
<div id="stage"><iframe id="f" src="./index.html"></iframe></div>
<div id="panel">
  <h3>Biểu cảm chính (app dùng)</h3>
  <div class="row" id="base"></div>
  <h3>Mặt / hiệu ứng (bật-tắt, cộng dồn)</h3>
  <div class="row" id="face"></div>
  <h3>Trang phục / tư thế</h3>
  <div class="row" id="pose"></div>
  <h3>Đạo cụ</h3>
  <div class="row" id="item"></div>
  <button class="wide" id="clear" style="margin-top:10px">Bỏ hết mặt / tư thế / đạo cụ</button>
  <h3>Lip-sync</h3>
  <button class="wide" id="talk">Nói thử 4 giây (cues giả lập)</button>
  <small>Gửi qua <code>window.onFlutterMessage</code> — đúng giao thức app dùng. Nhóm dưới "Biểu cảm chính" nạp thẳng file .exp3.json của model.</small>
</div>
<script>
  var f = document.getElementById('f');
  function send(m) { f.contentWindow.onFlutterMessage(JSON.stringify(m)); }
  var GROUPS = {
    base: ['neutral', 'happy', 'excited', 'thinking', 'embarrassed', 'sad'],
    face: ['Blush', 'side Blush', 'Star', 'Sweat Drop', 'Tears', 'Crying', 'Gloom', 'Dead Eyes',
           'Fanged Smile', 'Wide Mouth', 'Squinny Eyes', 'Pink Paint'],
    pose: ['School Uniform', 'Uniform Magic Eyes', 'Hand on Chest Pose', 'Hold Staff (Both Hands)', 'Hold Staff2',
           'Item Behind Back', 'Item Behind Back2', 'Open Arms', 'Overhead Staff Raise', 'Yandere'],
    item: ['staff (upside down)', 'axe', 'baseball bat', 'crowbar', 'hammer', 'hoe', 'pliers', 'saw',
           'scissors', 'shovel', 'stun baton', 'utility knife', 'wrench']
  };
  Object.keys(GROUPS).forEach(function (g) {
    var box = document.getElementById(g);
    GROUPS[g].forEach(function (name) {
      var b = document.createElement('button');
      b.textContent = name;
      b.onclick = function () {
        if (g === 'base') { send({ type: 'emotion', value: name }); return; }
        var on = !b.classList.contains('on');
        if (g === 'item') {
          // Đạo cụ chỉ hiện khi tay ở tư thế "Hold Staff2"; mỗi lúc chỉ cầm một món.
          [].forEach.call(document.querySelectorAll('#item button.on, #pose button.on'), function (o) {
            o.classList.remove('on');
            send({ type: 'exp', name: o.textContent, on: false });
          });
          if (on) {
            send({ type: 'exp', name: 'Hold Staff2', on: true });
            [].forEach.call(document.querySelectorAll('#pose button'), function (o) {
              o.classList.toggle('on', o.textContent === 'Hold Staff2');
            });
          }
        }
        b.classList.toggle('on', on);
        send({ type: 'exp', name: name, on: on });
      };
      box.appendChild(b);
    });
  });
  document.getElementById('clear').onclick = function () {
    send({ type: 'exp_clear' });
    document.querySelectorAll('button.on').forEach(function (b) { b.classList.remove('on'); });
  };
  document.getElementById('talk').onclick = function () {
    var cues = [];
    for (var t = 0; t <= 4000; t += 50) cues.push({ t_ms: t, mouth: Math.random() < 0.2 ? 0 : +(0.3 + Math.random() * 0.7).toFixed(2) });
    cues.push({ t_ms: 4050, mouth: 0 });
    send({ type: 'speech', seq: Date.now(), cues: cues, duration_ms: 4050 });
  };
</script>
</body>
</html>
