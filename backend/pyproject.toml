[project]
name = "miku-backend"
version = "0.1.0"
description = "Backend FastAPI cho app luyện nói tiếng Nhật (Phase 1: text chat)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "google-genai>=1.0",
    "pydantic>=2.8",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
